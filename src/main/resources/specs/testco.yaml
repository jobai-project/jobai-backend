# 오케스트레이터 테스트용 최소 스펙. src/test/resources/specs/testco.yaml 에 둔다.
# 실제 수집은 crawler 를 모킹하므로 url 등은 형식만 갖추면 된다.
company: testco
company_name_ko: "테스트사"
  response_path: jobs
pagination:
  type: none
source_type: json
crawler: declarative
list:
  url: https://example.test/api/jobs
required: [job_id, title]
fields:
  job_id: id
  title: title
