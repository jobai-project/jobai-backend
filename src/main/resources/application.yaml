spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email

---

spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jobai}
    username: ${POSTGRES_USER:jobai_user}
    password: ${POSTGRES_PASSWORD:jobai_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  cloud:
    aws:
      s3:
        enabled: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-key}
      model: claude-haiku-4-5-20251001
      base-url: https://api.anthropic.com
ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://localhost:8001}
search:
  embedding:
    enabled: ${SEARCH_EMBEDDING_ENABLED:true}
    max-text-length: 8000
    batch-size: 50
    batch-interval-ms: 60000
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
api:
  data-go-kr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:dummy-key-for-local}

app:
  auth:
    cookie:
      secure: false
    frontend-redirect-url: ${APP_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth2/redirect}

management:
  health:
    elasticsearch:
      enabled: false

websocket:
  # comma-separated allowed origins for WebSocket (use full origin(s), e.g. http://localhost:3000)
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

---

spring:
  config:
    activate:
      on-profile: prod

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-key}
      model: claude-haiku-4-5-20251001
      base-url: https://api.anthropic.com

server:
  forward-headers-strategy: framework

ai-server:
  base-url: ${AI_SERVER_BASE_URL}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}

api:
  data-go-kr:
    service-key: ${DATA_GO_KR_SERVICE_KEY:dummy-key-for-prod}

app:
  auth:
    cookie:
      secure: true
    frontend-redirect-url: ${APP_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth2/redirect}
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}

management:
  health:
    elasticsearch:
      enabled: false

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
