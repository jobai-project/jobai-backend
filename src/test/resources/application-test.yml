spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${TEST_POSTGRES_HOST:localhost}:${TEST_POSTGRES_PORT:5432}/${TEST_POSTGRES_DB:jobai_test}
    username: ${TEST_POSTGRES_USER:jobai_user}
    password: ${TEST_POSTGRES_PASSWORD:jobai_password}

  flyway:
    enabled: false

  ai:
    anthropic:
      api-key: dummy-key
      model: claude-haiku-4-5-20251001
      base-url: http://localhost:18080

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      s3:
        enabled: false

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://localhost:8001}

api:
  data-go-kr:
    service-key: dummy-data-go-kr-service-key

app:
  auth:
    cookie:
      secure: false
    frontend-redirect-url: http://localhost:3000/oauth2/redirect

websocket:
  allowed-origins: http://localhost:3000

management:
  health:
    elasticsearch:
      enabled: false

JWT_SECRET: test-jwt-secret-key-must-be-at-least-32-bytes-long
